spring.application.name=ms-productos
server.port=8082

# ===== Conexión a Oracle Autonomous Database (Oracle Cloud) =====
# Opción 1: archivo db-local.properties en la raíz del proyecto (no se sube a Git).
spring.config.import=optional:file:./db-local.properties
# Opción 2: variables de entorno DB_SERVICE, TNS_ADMIN, DB_USER y DB_PASSWORD.
spring.datasource.url=jdbc:oracle:thin:@${DB_SERVICE:fs3db_tp}?TNS_ADMIN=${TNS_ADMIN:./wallet}
spring.datasource.username=${DB_USER:ADMIN}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ===== JPA / Hibernate =====
# Las tablas se crean con sql/02_ms_productos.sql; "update" solo agrega lo que falte.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Comunicación con ms-usuarios =====
# ms-productos consulta a ms-usuarios para validar el rol de quien gestiona productos.
usuarios.service.url=${USUARIOS_URL:http://localhost:8081}

# ===== Logging =====
logging.level.root=INFO
logging.level.cl.duoc.productos=DEBUG
